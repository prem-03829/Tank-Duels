<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Match History | Tank Duel</title>

  <meta name="description" content="Review completed Tank Duel battles." />

  <meta name="theme-color" content="#0d0f0d" />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="stylesheet" href="../css/main.css" />

  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>

<body>

  <canvas class="animated-background" aria-hidden="true"></canvas>

  <main class="history-page">

    <!-- Back control: returns to the page the player came from when practical,
         otherwise the Dashboard. -->
    <a href="./dashboard.html" class="history-back" id="history-back">
      ← BACK
    </a>

    <!-- Header -->
    <header class="history-header">

      <span class="section-label">MATCH HISTORY</span>

      <h1 class="history-title">History</h1>

      <p class="history-description">
        Completed battles, latest first.
      </p>

    </header>

    <!-- Filter pills: client-side narrowing of the already-loaded history.
         ALL is selected by default; switching never refetches from the server. -->
    <div class="history-filters" role="group" aria-label="Filter match history">
      <button type="button" class="history-filter" data-history-filter="all" aria-pressed="true">ALL</button>
      <button type="button" class="history-filter" data-history-filter="online" aria-pressed="false">ONLINE</button>
      <button type="button" class="history-filter" data-history-filter="same_device" aria-pressed="false">SAME
        DEVICE</button>
    </div>

    <!-- Entries -->
    <section class="history-list" id="history-list">

      <div class="history-empty" id="history-empty">
        <h2 class="history-empty-title">No Match History</h2>
        <p class="history-empty-message">Completed battles will appear here.</p>
      </div>

    </section>

  </main>

  <script src="../js/app.js"></script>
  <script src="../js/animated-background.js"></script>
  <script src="../js/game/constants.js"></script>
  <script src="../js/shared/api.js"></script>
  <script src="../js/shared/history.js"></script>
  <script src="../js/pages/history.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="924d3042-3358-4f71-a9cc-cb7e8e51c27a"></script>

</body>

</html>
