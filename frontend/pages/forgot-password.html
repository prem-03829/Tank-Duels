<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Forgot Password | Tank Duel</title>

  <meta name="description" content="Request a password reset link for your Tank Duel account." />

  <meta name="theme-color" content="#0d0f0d" />

  <link rel="stylesheet" href="../css/main.css" />

  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>

<body>

  <canvas class="animated-background" aria-hidden="true"></canvas>

  <main class="auth-page">

    <section class="auth-content">

      <div class="auth-container">

        <!-- Back -->
        <a href="./login.html" class="auth-back">
          ← Back to Login
        </a>

        <!-- Header -->
        <header class="auth-header">
          <div class="auth-logo">TANK DUEL</div>

          <h1 class="auth-title">Reset Password</h1>

          <p class="auth-description">
            Enter your email to receive a password reset link.
          </p>
        </header>

        <!-- Form -->
        <form class="auth-form" id="forgot-password-form">

          <div class="form-group">
            <label class="form-label" for="email">
              Email
            </label>

            <input class="form-input" type="email" id="email" name="email" placeholder="Enter your email"
              autocomplete="email" required />
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            Send Reset Link
          </button>

        </form>

        <!-- Status Message Container -->
        <div id="forgot-status" style="display: none; margin-top: 1rem; padding: 0.85rem; border-radius: 4px; background: rgba(76, 175, 80, 0.15); border: 1px solid rgba(76, 175, 80, 0.4); color: #81c784; font-size: 0.9rem; text-align: center;">
        </div>

        <!-- Switch -->
        <p class="auth-switch">
          Remembered your password?
          <a href="./login.html">Login</a>
        </p>

      </div>

    </section>

  </main>

  <script src="../js/app.js"></script>
  <script src="../js/animated-background.js"></script>
  <script src="../js/shared/api.js"></script>
  <script src="../js/pages/forgot-password.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="924d3042-3358-4f71-a9cc-cb7e8e51c27a"></script>

</body>

</html>
