<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create Account | Tank Duel</title>

  <meta name="description" content="Create a Tank Duel account and save your battle progress." />

  <meta name="theme-color" content="#0d0f0d" />

  <link rel="stylesheet" href="../css/main.css" />

  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <canvas class="animated-background" aria-hidden="true"></canvas>

  <main class="auth-page">

    <section class="auth-content">

      <div class="auth-container">

        <!-- Back -->
        <a href="../index.html" class="auth-back">
          ← Back to Main Menu
        </a>

        <!-- Header -->
        <header class="auth-header">
          <div class="auth-logo">TANK DUEL</div>

          <h1 class="auth-title">Create Account</h1>

          <p class="auth-description">
            Create your profile and start battling.
          </p>
        </header>

        <!-- Signup Form -->
        <form class="auth-form" id="signup-form">

          <div class="form-group">
            <label class="form-label" for="username">
              Username
            </label>

            <input class="form-input" type="text" id="username" name="username" placeholder="Choose a username"
              autocomplete="username" minlength="3" maxlength="20" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="email">
              Email
            </label>

            <input class="form-input" type="email" id="email" name="email" placeholder="Enter your email"
              autocomplete="email" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">
              Password
            </label>

            <input class="form-input" type="password" id="password" name="password" placeholder="Create a password"
              autocomplete="new-password" required />

            <div class="password-strength-container" id="password-strength-container" style="margin-top: 4px;">
              <div class="password-strength-dots" style="display: flex; gap: 6px; margin-bottom: 4px;">
                <span class="strength-dot" style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); transition: background 0.2s;"></span>
                <span class="strength-dot" style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); transition: background 0.2s;"></span>
                <span class="strength-dot" style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); transition: background 0.2s;"></span>
                <span class="strength-dot" style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); transition: background 0.2s;"></span>
                <span class="strength-dot" style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); transition: background 0.2s;"></span>
              </div>
              <div class="form-helper" style="font-size: 0.75rem; color: var(--text-muted, #888);">
                Use 8+ characters with a letter, number and symbol
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">
              Confirm Password
            </label>

            <input class="form-input" type="password" id="confirm-password" name="confirm-password"
              placeholder="Confirm your password" autocomplete="new-password" required />
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            Create Account
          </button>

        </form>

        <!-- Divider -->
        <div style="display: flex; align-items: center; margin: 1.25rem 0; color: var(--text-muted, #888); font-size: 0.8rem; letter-spacing: 0.05em;">
          <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.15);"></div>
          <span style="padding: 0 0.75rem; text-transform: uppercase;">OR</span>
          <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.15);"></div>
        </div>

        <!-- Google Sign-In -->
        <button type="button" id="google-signin-btn" class="btn btn-secondary btn-block" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text-primary, #fff); font-weight: 500;">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/>
            <path fill="#FBBC05" d="M3.88 10.78c-.18-.53-.28-1.09-.28-1.78s.1-1.25.28-1.78L.97 4.96C.35 6.18 0 7.55 0 9s.35 2.82.97 4.04l2.91-2.26z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.97 4.96l2.91 2.26C4.6 5.05 6.62 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </button>

        <!-- Switch -->
        <p class="auth-switch">
          Already have an account?
          <a href="./login.html">Login</a>
        </p>

      </div>

    </section>

  </main>

  <script src="../js/app.js"></script>
  <script src="../js/animated-background.js"></script>
  <script src="../js/shared/api.js"></script>
  <script src="../js/shared/notify.js"></script>
  <script src="../js/pages/auth.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="924d3042-3358-4f71-a9cc-cb7e8e51c27a"></script>

</body>

</html>
