<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reset Password | Tank Duels</title>

  <meta name="description" content="Set a new password for your Tank Duels account." />

  <meta name="theme-color" content="#0d0f0d" />

  <link rel="stylesheet" href="../css/main.css" />

  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>

<body>

  <canvas class="animated-background" aria-hidden="true"></canvas>

  <main class="auth-page">

    <section class="auth-content">

      <div class="auth-container">

        <!-- Back -->
        <a href="./login.html" class="auth-back">
          ← Back to Login
        </a>

        <!-- Header -->
        <header class="auth-header">
          <div class="auth-logo">TANK DUELS</div>

          <h1 class="auth-title">Set New Password</h1>

          <p class="auth-description" id="reset-description">
            Enter your new password below.
          </p>
        </header>

        <!-- Invalid / Expired Link Banner -->
        <div id="reset-error-banner" style="display: none; margin-bottom: 1.5rem; padding: 1rem; border-radius: 4px; background: rgba(244, 67, 54, 0.15); border: 1px solid rgba(244, 67, 54, 0.4); color: #ef5350; font-size: 0.9rem; text-align: center;">
          <p style="margin-bottom: 0.75rem;" id="reset-error-message">This password reset link is invalid or has expired.</p>
          <a href="./forgot-password.html" class="btn btn-primary" style="display: inline-block; padding: 0.5rem 1rem; font-size: 0.85rem; text-decoration: none;">Request New Reset Link</a>
        </div>

        <!-- Success Banner -->
        <div id="reset-success-banner" style="display: none; margin-bottom: 1.5rem; padding: 1rem; border-radius: 4px; background: rgba(76, 175, 80, 0.15); border: 1px solid rgba(76, 175, 80, 0.4); color: #81c784; font-size: 0.9rem; text-align: center;">
          <p style="margin-bottom: 0.75rem;">Password updated successfully! You can now log in with your new password.</p>
          <a href="./login.html" class="btn btn-primary btn-block" style="display: block; text-decoration: none;">Go to Login</a>
        </div>

        <!-- Form -->
        <form class="auth-form" id="reset-password-form">

          <div class="form-group">
            <label class="form-label" for="password">
              New Password
            </label>

            <input class="form-input" type="password" id="password" name="password" placeholder="Enter new password"
              autocomplete="new-password" minlength="6" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">
              Confirm New Password
            </label>

            <input class="form-input" type="password" id="confirm-password" name="confirm-password"
              placeholder="Confirm new password" autocomplete="new-password" minlength="6" required />
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            Update Password
          </button>

        </form>

        <!-- Switch -->
        <p class="auth-switch" id="reset-switch">
          Remembered your password?
          <a href="./login.html">Login</a>
        </p>

      </div>

    </section>

  </main>

  <script src="../js/app.js"></script>
  <script src="../js/animated-background.js"></script>
  <script src="../js/shared/api.js"></script>
  <script src="../js/shared/notify.js"></script>
  <script src="../js/pages/reset-password.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="924d3042-3358-4f71-a9cc-cb7e8e51c27a"></script>

</body>

</html>
