<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Profile | Tank Duel</title>
  <meta name="description" content="View your Tank Duel player profile and battle statistics." />
  <meta name="theme-color" content="#0d0f0d" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Styles -->
  <link rel="stylesheet" href="../css/main.css" />

  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>

<body>

  <canvas class="animated-background" aria-hidden="true"></canvas>

  <main class="profile-page">

    <!-- Back Navigation -->
    <a href="./dashboard.html" class="back-link">
      ← BACK TO COMMAND CENTER
    </a>

    <!-- Page Header -->
    <section class="profile-header">
      <div class="profile-avatar" id="profile-avatar-container" aria-hidden="true">
        <img id="profile-avatar-img" src="../assets/images/avatars/tank-00.png" alt="Profile Avatar" style="display: none;" />
        <span id="profile-initial">P</span>
      </div>

      <div class="profile-heading">
        <span class="section-label">PLAYER PROFILE</span>

        <h1 id="profile-name">PLAYER</h1>

        <p id="profile-type">
          GUEST OPERATIVE
        </p>

        <button type="button" id="edit-avatar-btn" class="btn btn-secondary btn-sm" style="margin-top: 0.5rem; align-self: flex-start; padding: 0.4rem 0.85rem; font-size: 0.75rem;">
          EDIT AVATAR
        </button>
      </div>
    </section>

    <!-- Avatar Editor Section -->
    <section class="profile-section avatar-editor-section" id="avatar-editor-section" style="display: none;">
      <div class="profile-section-header avatar-editor-header">
        <span class="section-label">SELECT AVATAR</span>
        <button type="button" id="close-avatar-editor-btn" aria-label="Close avatar editor" class="avatar-editor-close">✕</button>
      </div>

      <!-- Tab bar (only shown to authenticated users via JS) -->
      <div class="avatar-tabs" id="avatar-tabs" style="display: none;">
        <button type="button" class="avatar-tab active" id="tab-preset" data-tab="preset" aria-pressed="true">PRESETS</button>
        <button type="button" class="avatar-tab" id="tab-custom" data-tab="custom" aria-pressed="false">CUSTOM</button>
      </div>

      <!-- Preset panel -->
      <div class="avatar-editor-content" id="panel-preset">
        <div class="avatar-grid" id="avatar-grid">
          <!-- Dynamically loaded from avatars.json -->
        </div>
        <div class="avatar-editor-actions">
          <button type="button" id="cancel-avatar-btn" class="btn btn-secondary">CANCEL</button>
          <button type="button" id="save-avatar-btn" class="btn btn-primary">SAVE AVATAR</button>
        </div>
      </div>

      <!-- Custom upload panel (initially hidden, only for authenticated users) -->
      <div class="avatar-editor-content" id="panel-custom" style="display: none;">
        <!-- Drop / click zone -->
        <div class="avatar-upload-zone" id="avatar-upload-zone" role="button" tabindex="0" aria-label="Upload a custom avatar image">
          <svg class="avatar-upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p class="avatar-upload-hint">Click or drag &amp; drop an image here</p>
          <p class="avatar-upload-hint-sub">JPEG · PNG · WebP &nbsp;·&nbsp; max 5 MB</p>
        </div>
        <input type="file" id="avatar-file-input" accept="image/jpeg,image/png,image/webp" aria-label="Choose avatar image file" style="display: none;" />
        <div class="avatar-editor-actions">
          <button type="button" id="cancel-custom-btn" class="btn btn-secondary">CANCEL</button>
        </div>
      </div>
    </section>

    <!-- Canvas Crop Modal -->
    <div class="avatar-crop-overlay" id="avatar-crop-overlay" style="display: none;" role="dialog" aria-modal="true" aria-label="Crop your avatar">
      <div class="avatar-crop-modal">
        <div class="avatar-crop-header">
          <span class="section-label">CROP AVATAR</span>
          <button type="button" id="crop-cancel-btn" class="avatar-editor-close" aria-label="Cancel crop">✕</button>
        </div>
        <div class="avatar-crop-viewport">
          <canvas id="avatar-crop-canvas" aria-label="Avatar crop canvas"></canvas>
          <div class="avatar-crop-frame" aria-hidden="true"></div>
        </div>
        <p class="avatar-crop-hint">Drag to pan &nbsp;·&nbsp; Scroll / pinch to zoom</p>
        <div class="avatar-crop-actions">
          <button type="button" id="crop-cancel-btn-2" class="btn btn-secondary">CANCEL</button>
          <button type="button" id="crop-apply-btn" class="btn btn-primary">APPLY CROP</button>
        </div>
      </div>
    </div>

    <!-- Statistics -->
    <section class="profile-section">

      <div class="profile-section-header">
        <span class="section-label">BATTLE RECORD</span>
      </div>

      <div class="profile-stats">

        <div class="profile-stat">
          <span class="profile-stat-value" id="profile-games">
            0
          </span>

          <span class="profile-stat-label">
            BATTLES
          </span>
        </div>

        <div class="profile-stat">
          <span class="profile-stat-value" id="profile-wins">
            0
          </span>

          <span class="profile-stat-label">
            VICTORIES
          </span>
        </div>

        <div class="profile-stat">
          <span class="profile-stat-value" id="profile-winrate">
            —
          </span>

          <span class="profile-stat-label">
            WIN RATE
          </span>
        </div>

      </div>

    </section>

    <!-- Account -->
    <section class="profile-section profile-account">

      <div class="profile-section-header">
        <span class="section-label">ACCOUNT</span>
      </div>

      <div class="profile-account-row">
        <span>Account Type</span>

        <span class="profile-account-value" id="profile-account-type">
          Guest
        </span>
      </div>

    </section>

  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/app.js"></script>
  <script src="../js/animated-background.js"></script>
  <script src="../js/shared/api.js"></script>
  <script src="../js/shared/notify.js"></script>
  <script src="../js/shared/avatar.js"></script>
  <script src="../js/shared/statistics.js"></script>
  <script src="../js/pages/profile.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="924d3042-3358-4f71-a9cc-cb7e8e51c27a"></script>

</body>

</html>
