<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Player Hub | Tank Duel</title>
  <meta name="description" content="Access your Tank Duel player hub, view your stats, and start a new battle." />

  <meta name="theme-color" content="#0d0f0d" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Styles -->
  <link rel="stylesheet" href="../css/main.css" />
</head>

<body>
  
  <canvas class="animated-background" aria-hidden="true"></canvas>

  <main class="dashboard-page">

    <!-- Header -->
    <header class="dashboard-header">

      <a href="../index.html" class="dashboard-logo">
        TANK DUEL
      </a>

      <div class="dashboard-user-actions">
        <span class="ui-label" id="player-name">
          PLAYER
        </span>

        <button class="btn btn-outline btn-sm" id="logout-btn" type="button">
          Logout
        </button>
      </div>

    </header>


    <!-- Main Content -->
    <section class="dashboard-content">

      <!-- Welcome -->
      <div class="dashboard-welcome">

        <div class="dashboard-welcome-label">
          Command Center
        </div>

        <h1>
          Ready for Battle?
        </h1>

        <p>
          Adjust your aim. Choose your battlefield. Fire when ready.
        </p>

      </div>


      <!-- Primary Action -->
      <div class="play-action">

        <a href="./game-setup.html" class="btn btn-primary btn-lg btn-block">
          Start Battle
        </a>

      </div>


      <!-- Secondary Navigation -->
      <nav class="dashboard-navigation">

        <a href="./profile.html" class="btn btn-secondary">
          Profile
        </a>

        <a href="./settings.html" class="btn btn-outline">
          Settings
        </a>

      </nav>


      <!-- Stats -->
      <div class="dashboard-stats">

        <div class="stat-item">
          <span class="stat-value" id="stat-games">
            0
          </span>
          <span class="stat-label">
            Battles
          </span>
        </div>

        <div class="stat-item">
          <span class="stat-value" id="stat-wins">
            0
          </span>
          <span class="stat-label">
            Victories
          </span>
        </div>

        <div class="stat-item">
          <span class="stat-value" id="stat-winrate">
            —
          </span>
          <span class="stat-label">
            Win Rate
          </span>
        </div>

      </div>

    </section>

  </main>

  <script src="../js/app.js"></script>
  <script src="../js/animated-background.js"></script>
  <script src="../js/pages/dashboard.js"></script>

</body>

</html>
