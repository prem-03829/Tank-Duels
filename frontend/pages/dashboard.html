<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Player Hub | Tank Duels</title>
  <meta name="description" content="Access your Tank Duels player hub, view your stats, and start a new battle." />

  <meta name="theme-color" content="#0d0f0d" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Styles -->
  <link rel="stylesheet" href="../css/main.css" />

  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>

<body>

  <canvas class="animated-background" aria-hidden="true"></canvas>

  <main class="dashboard-page">

    <!-- Header -->
    <header class="dashboard-header">

      <a href="../index.html" class="dashboard-logo">
        TANK DUELS
      </a>

      <div class="account-menu" id="account-menu">

        <button class="account-menu-trigger" id="account-menu-toggle" type="button" aria-label="Account menu"
          aria-haspopup="true" aria-expanded="false" aria-controls="account-menu-dropdown">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="square" aria-hidden="true" focusable="false">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
          </svg>
        </button>

        <nav class="account-menu-dropdown" id="account-menu-dropdown" aria-labelledby="account-menu-toggle"
          aria-hidden="true">

          <a href="./profile.html" class="account-menu-item" role="menuitem">
            Profile
          </a>

          <a href="./history.html" class="account-menu-item" role="menuitem">
            History
          </a>

          <a href="./settings.html" class="account-menu-item" role="menuitem">
            Settings
          </a>

          <div class="account-menu-divider" role="separator"></div>

          <button class="account-menu-item account-menu-logout" id="logout-btn" type="button" role="menuitem">
            Logout
          </button>

        </nav>

      </div>

    </header>


    <!-- Main Content -->
    <section class="dashboard-content">

      <!-- Welcome -->
      <div class="dashboard-welcome">

        <div class="dashboard-welcome-label">
          Command Center
        </div>

        <h1>
          Ready for Battle?
        </h1>

        <p>
          Adjust your aim. Choose your battlefield. Fire when ready.
        </p>

      </div>


      <!-- Primary Action -->
      <div class="play-action">

        <a href="./game-mode.html" class="btn btn-primary btn-lg btn-block">
          Start Battle
        </a>

      </div>


      <!-- Stats -->
      <div class="dashboard-stats">

        <div class="stat-item">
          <span class="stat-value" id="stat-games">
            —
          </span>
          <span class="stat-label">
            Battles
          </span>
        </div>

        <div class="stat-item">
          <span class="stat-value" id="stat-wins">
            —
          </span>
          <span class="stat-label">
            Victories
          </span>
        </div>

        <div class="stat-item">
          <span class="stat-value" id="stat-winrate">
            —
          </span>
          <span class="stat-label">
            Win Rate
          </span>
        </div>

      </div>

    </section>

    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="main-menu-footer">

      <div class="footer-brand">

        <div class="footer-tank" aria-hidden="true">
          ▰
        </div>

        <div>
          <span class="footer-title">
            TANK DUELS
          </span>

          <span class="footer-subtitle">
            TURN-BASED ARTILLERY GAME
          </span>
        </div>

      </div>


      <div class="footer-links">

        <a href="https://github.com/prem-03829/Tank-Duels" target="_blank" rel="noopener noreferrer">
          ◉ GITHUB
        </a>

        <span class="footer-separator"></span>

        <a href="about.html">
          ABOUT
        </a>

      </div>


      <div class="footer-copy">
        © 2026 Tank Duels
      </div>

    </footer>


  </main>

  <script src="../js/app.js"></script>
  <script src="../js/animated-background.js"></script>
  <script src="../js/shared/statistics.js"></script>
  <script src="../js/shared/api.js"></script>
  <script src="../js/shared/notify.js"></script>
  <script src="../js/shared/avatar.js"></script>
  <script src="../js/pages/dashboard.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="924d3042-3358-4f71-a9cc-cb7e8e51c27a"></script>

</body>

</html>
