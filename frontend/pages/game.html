<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Battle | Tank Duel</title>

  <meta name="description" content="Play Tank Duel — aim, fire, and destroy your opponent." />

  <meta name="theme-color" content="#0d0f0d" />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="stylesheet" href="../css/main.css" />
</head>

<body>

  <main class="game-page">

    <!-- =========================
         GAME HEADER
    ========================== -->

    <header class="game-header">

      <div class="player-info">
        <span class="player-label">Player 1</span>
        <span class="player-name" id="player-one-name">PLAYER</span>
      </div>

      <div class="game-status" id="game-status">Player 1's Turn</div>

      <div class="game-header-right">

        <div class="player-info right">
          <span class="player-label">Player 2</span>
          <span class="player-name" id="player-two-name">OPPONENT</span>
        </div>

        <button class="game-icon-btn" id="fullscreen-btn" type="button" aria-label="Toggle fullscreen">
          FULL
        </button>

        <button class="game-quit-btn" id="quit-game-btn" type="button" aria-label="Quit battle">
          QUIT
        </button>

      </div>

    </header>


    <!-- =========================
         BATTLEFIELD
    ========================== -->

    <section class="game-area">

      <div class="game-canvas-container">

        <canvas id="game-canvas" class="game-canvas"></canvas>

        <div class="tank-overlay" id="tank-overlay-0">
          <span class="tank-overlay-name" id="tank-overlay-name-0">PLAYER</span>
          <div class="tank-overlay-health">
            <div class="tank-overlay-hp">
              <div class="tank-overlay-hp-fill"></div>
            </div>
            <span class="tank-overlay-hp-text">100 HP</span>
          </div>
        </div>

        <div class="tank-overlay" id="tank-overlay-1">
          <span class="tank-overlay-name" id="tank-overlay-name-1">OPPONENT</span>
          <div class="tank-overlay-health">
            <div class="tank-overlay-hp">
              <div class="tank-overlay-hp-fill"></div>
            </div>
            <span class="tank-overlay-hp-text">100 HP</span>
          </div>
        </div>

      </div>

    </section>


    <!-- =========================
         GAME CONTROLS
    ========================== -->

    <footer class="game-controls">

      <div class="controls-row controls-main">

        <div class="slider-group">
          <span class="slider-label">ANGLE</span>
          <button class="adj-btn" id="angle-minus" type="button" aria-label="Decrease angle">&minus;</button>
          <input type="range" id="angle-slider" class="game-range" min="0" max="180" value="45" step="1" />
          <button class="adj-btn" id="angle-plus" type="button" aria-label="Increase angle">+</button>
          <span class="slider-value" id="angle-value">45&deg;</span>
        </div>

        <div class="fire-btn-wrap">
          <button class="btn btn-primary fire-button" id="fire-button" type="button">
            FIRE
          </button>
        </div>

        <div class="slider-group">
          <span class="slider-label">POWER</span>
          <button class="adj-btn" id="power-minus" type="button" aria-label="Decrease power">&minus;</button>
          <input type="range" id="power-slider" class="game-range" min="5" max="100" value="50" step="1" />
          <button class="adj-btn" id="power-plus" type="button" aria-label="Increase power">+</button>
          <span class="slider-value" id="power-value">50%</span>
        </div>

      </div>

      <div class="controls-row controls-info">
        <span class="info-item"><span class="info-label">MAP</span> <span class="info-value" id="map-name">Desert</span></span>
        <span class="info-item"><span class="info-label">WIND</span> <span class="info-value" id="wind-display">&mdash;</span></span>
        <span class="info-item"><span class="info-label">ROUND</span> <span class="info-value" id="round-value">1 / 1</span></span>
      </div>

    </footer>

  </main>

  <!-- =========================
       QUIT CONFIRMATION
  ========================== -->

  <div class="quit-modal" id="quit-modal" aria-hidden="true">
    <div class="quit-modal-backdrop" id="quit-modal-backdrop"></div>

    <div class="quit-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="quit-modal-title">

      <span class="quit-modal-label">
        BATTLE INTERRUPTION
      </span>

      <h2 id="quit-modal-title">
        Quit Battle?
      </h2>

      <p>
        Your current battle will be abandoned. This match will not be recorded.
      </p>

      <div class="quit-modal-actions">

        <button class="btn btn-outline" id="cancel-quit-btn" type="button">
          CONTINUE
        </button>

        <button class="btn btn-danger" id="confirm-quit-btn" type="button">
          QUIT BATTLE
        </button>

      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/app.js"></script>
  <script src="../js/game/constants.js"></script>
  <script src="../js/game/audio.js"></script>
  <script src="../js/game/terrain.js"></script>
  <script src="../js/game/tank.js"></script>
  <script src="../js/game/projectile.js"></script>
  <script src="../js/game/particles.js"></script>
  <script src="../js/game/engine.js"></script>
  <script src="../js/pages/game.js"></script>

</body>

</html>
