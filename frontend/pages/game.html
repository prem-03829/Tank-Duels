<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Battle | Tank Duel</title>

  <meta name="description" content="Play Tank Duel — aim, fire, and destroy your opponent." />

  <meta name="theme-color" content="#0d0f0d" />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="stylesheet" href="../css/main.css" />

  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>

<body>

  <main class="game-page">

    <!-- =========================
         GAME HEADER
    ========================== -->

    <header class="game-header">

      <div class="player-info">
        <span class="player-label">Player 1</span>
        <span class="player-name" id="player-one-name">PLAYER</span>
      </div>

      <div class="game-status" id="game-status">Player 1's Turn</div>

      <div class="game-header-right">

        <div class="player-info right">
          <span class="player-label">Player 2</span>
          <span class="player-name" id="player-two-name">OPPONENT</span>
        </div>

        <button class="game-quit-btn" id="quit-game-btn" type="button" aria-label="Quit battle">
          QUIT
        </button>

      </div>

    </header>


    <!-- =========================
         BATTLEFIELD
    ========================== -->

    <section class="game-area">

      <div class="game-canvas-container">

        <canvas id="game-canvas" class="game-canvas"></canvas>

        <!-- Compact wind-status group at the top-center of the battlefield -->
        <div class="match-status" role="status" aria-label="Wind status">
          <span class="info-item"><span class="info-label">WIND</span> <span class="info-value"
              id="wind-display">&mdash;</span></span>
        </div>

        <!-- Shared pixel-art arrow used by the active-player indicator.
             The <g> is populated from a pixel map at runtime (js/pages/game.js). -->
        <svg width="0" height="0" aria-hidden="true" focusable="false"
          style="position:absolute;width:0;height:0;overflow:hidden">
          <defs>
            <g id="active-player-indicator" shape-rendering="crispEdges"></g>
          </defs>
        </svg>

        <div class="tank-overlay" id="tank-overlay-0">
          <div class="tank-overlay-indicator" role="presentation">
            <div class="tank-overlay-indicator-glow"></div>
            <svg viewBox="0 0 15 10" aria-hidden="true" focusable="false">
              <use href="#active-player-indicator"></use>
            </svg>
          </div>
          <span class="tank-overlay-name" id="tank-overlay-name-0">PLAYER</span>
          <div class="tank-overlay-health">
            <div class="tank-overlay-hp">
              <div class="tank-overlay-hp-fill"></div>
            </div>
            <span class="tank-overlay-hp-text">100 HP</span>
          </div>
        </div>

        <div class="tank-overlay" id="tank-overlay-1">
          <div class="tank-overlay-indicator" role="presentation">
            <div class="tank-overlay-indicator-glow"></div>
            <svg viewBox="0 0 15 10" aria-hidden="true" focusable="false">
              <use href="#active-player-indicator"></use>
            </svg>
          </div>
          <span class="tank-overlay-name" id="tank-overlay-name-1">OPPONENT</span>
          <div class="tank-overlay-health">
            <div class="tank-overlay-hp">
              <div class="tank-overlay-hp-fill"></div>
            </div>
            <span class="tank-overlay-hp-text">100 HP</span>
          </div>
        </div>

        <button class="game-fullscreen-btn" id="fullscreen-btn" type="button" aria-label="Toggle fullscreen"
          title="Toggle fullscreen">
          <svg class="fullscreen-icon icon-expand" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true" focusable="false">
            <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
          </svg>
          <svg class="fullscreen-icon icon-exit" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true" focusable="false">
            <path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" />
          </svg>
        </button>

      </div>

    </section>


    <!-- =========================
         GAME CONTROLS
    ========================== -->

    <footer class="game-controls">

      <div class="controls-row controls-main">

        <div class="slider-group">
          <div class="slider-controls-row">
            <button class="adj-btn" id="angle-minus" type="button" aria-label="Decrease angle">&minus;</button>
            <div class="dial-control angle-dial" id="angle-control" data-control="angle" role="button" tabindex="0"
              aria-label="Angle control. Click and drag around the dial to aim.">
              <span class="dial-ring" aria-hidden="true"></span>
              <span class="dial-hand" aria-hidden="true"></span>
              <span class="dial-value" id="angle-value">45&deg;</span>
            </div>
            <button class="adj-btn" id="angle-plus" type="button" aria-label="Increase angle">+</button>
          </div>
          <span class="slider-label">ANGLE</span>
        </div>

        <div class="fire-btn-wrap">
          <div class="round-block">
            <span class="round-label">ROUND</span>
            <span class="round-display" id="round-value">1 / 1</span>
          </div>
          <button class="btn btn-primary fire-button" id="fire-button" type="button">
            FIRE
          </button>
          <span class="info-value map-name" id="map-name">Desert</span>
        </div>

        <div class="slider-group">
          <div class="slider-controls-row">
            <button class="adj-btn" id="power-minus" type="button" aria-label="Decrease power">&minus;</button>
            <div class="dial-control power-control" id="power-control" data-control="power" role="button" tabindex="0"
              aria-label="Power control. Click, then move the mouse left or right to adjust power.">
              <span class="power-bar" aria-hidden="true">
                <span class="power-bar-fill" id="power-bar-fill"></span>
              </span>
              <span class="dial-value" id="power-value">50%</span>
            </div>
            <button class="adj-btn" id="power-plus" type="button" aria-label="Increase power">+</button>
          </div>
          <span class="slider-label">POWER</span>
        </div>

      </div>

    </footer>

    <!-- Angle cursor: small "+" crosshair orbiting the active tank at a fixed radius -->
    <div class="angle-cursor" id="angle-cursor" aria-hidden="true">
      <svg viewBox="0 0 9 9" width="18" height="18" shape-rendering="crispEdges">
        <rect x="3" y="0" width="3" height="1" fill="#0a0a0a" />
        <rect x="3" y="8" width="3" height="1" fill="#0a0a0a" />
        <rect x="0" y="3" width="1" height="3" fill="#0a0a0a" />
        <rect x="8" y="3" width="1" height="3" fill="#0a0a0a" />
        <rect x="3" y="1" width="1" height="7" fill="#0a0a0a" />
        <rect x="5" y="1" width="1" height="7" fill="#0a0a0a" />
        <rect x="1" y="3" width="7" height="1" fill="#0a0a0a" />
        <rect x="1" y="5" width="7" height="1" fill="#0a0a0a" />
        <g fill="currentColor">
          <rect x="4" y="1" width="1" height="7" />
          <rect x="1" y="4" width="7" height="1" />
        </g>
      </svg>
    </div>

  </main>

  <!-- =========================
       QUIT CONFIRMATION
  ========================== -->

  <div class="quit-modal" id="quit-modal" aria-hidden="true">
    <div class="quit-modal-backdrop" id="quit-modal-backdrop"></div>

    <div class="quit-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="quit-modal-title">

      <span class="quit-modal-label">
        BATTLE INTERRUPTION
      </span>

      <h2 id="quit-modal-title">
        Quit Battle?
      </h2>

      <p>
        Your current battle will be abandoned. This match will not be recorded.
      </p>

      <div class="quit-modal-actions">

        <button class="btn btn-outline" id="cancel-quit-btn" type="button">
          CONTINUE
        </button>

        <button class="btn btn-danger" id="confirm-quit-btn" type="button">
          QUIT BATTLE
        </button>

      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/app.js"></script>
  <script src="../js/game/constants.js"></script>
  <script src="../js/shared/api.js"></script>
  <script src="../js/shared/history.js"></script>
  <script src="../js/game/audio.js"></script>
  <script src="../js/game/terrain.js"></script>
  <script src="../js/game/tank.js"></script>
  <script src="../js/game/projectile.js"></script>
  <script src="../js/game/particles.js"></script>
  <script src="../js/game/engine.js"></script>
  <script src="../js/pages/game.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="924d3042-3358-4f71-a9cc-cb7e8e51c27a"></script>

</body>

</html>
