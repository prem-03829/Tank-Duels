<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tank Duels — Online Turn-Based Artillery Game</title>

  <meta name="description"
    content="Tank Duels is a browser-based turn-based artillery game featuring online 1v1 and same-device battles." />

  <link rel="canonical" href="https://tank-duels-flax.vercel.app/" />

  <meta name="theme-color" content="#0b0f0d" />

  <link rel="stylesheet" href="./css/main.css" />

  <link rel="icon" type="image/png" href="assets/favicon.png" />
</head>

<body>

  <main class="main-menu">

    <!-- =========================
         BACKGROUND
    ========================== -->

    <canvas class="animated-background" aria-hidden="true"></canvas>

    <div class="menu-grid" aria-hidden="true"></div>

    <div class="menu-glow" aria-hidden="true"></div>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <section class="menu-content">

      <!-- Logo / Title -->

      <div class="game-brand">

        <div class="target-frame">

          <span class="target-corner top-left"></span>
          <span class="target-corner top-right"></span>
          <span class="target-corner bottom-left"></span>
          <span class="target-corner bottom-right"></span>

          <span class="target-cross left"></span>
          <span class="target-cross right"></span>

          <h1 class="game-title">
            <span>TANK</span>
            <span>DUEL</span>
          </h1>

        </div>

        <div class="game-tagline">
          <span></span>
          TURN-BASED ARTILLERY GAME
          <span></span>
        </div>

      </div>


      <!-- Menu -->

      <nav class="main-menu-actions">

        <a href="./pages/dashboard.html" class="menu-button menu-button-primary" data-play-guest id="menu-play-guest">
          <span>PLAY AS GUEST</span>
          <span class="menu-arrow">›</span>
        </a>

        <!-- Authenticated state: shown only when main-menu.js detects an
             existing user session. Starts hidden; guests never see it.
             Built only from classes already used on this page. -->
        <a href="./pages/dashboard.html" class="menu-button menu-button-primary" id="menu-authed" style="display:none">
          <span>CONTINUE AS <span id="menu-authed-name">PLAYER</span></span>
          <span class="menu-arrow">›</span>
        </a>


        <div class="menu-divider" id="menu-divider">
          <span></span>
          <small>OR</small>
          <span></span>
        </div>


        <a href="./pages/login.html" class="menu-button" id="menu-login">
          <span>LOGIN</span>
          <span class="menu-arrow">›</span>
        </a>


        <a href="./pages/signup.html" class="menu-button" id="menu-signup">
          <span>SIGN UP</span>
          <span class="menu-arrow">›</span>
        </a>

      </nav>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="main-menu-footer">

      <div class="footer-brand">

        <div class="footer-tank" aria-hidden="true">
          ▰
        </div>

        <div>
          <span class="footer-title">
            TANK DUEL
          </span>

          <span class="footer-subtitle">
            TURN-BASED ARTILLERY GAME
          </span>
        </div>

      </div>


      <div class="footer-links">

        <a href="#" aria-label="GitHub">
          ◉
        </a>

        <a href="#">
          GITHUB
        </a>

        <span class="footer-separator"></span>

        <a href="#">
          ABOUT
        </a>

      </div>


      <div class="footer-copy">
        © 2026 Tank Duel
      </div>

    </footer>

  </main>


  <script src="./js/app.js"></script>
  <script src="./js/animated-background.js"></script>
  <script src="./js/pages/main-menu.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="924d3042-3358-4f71-a9cc-cb7e8e51c27a"></script>
</body>

</html>
